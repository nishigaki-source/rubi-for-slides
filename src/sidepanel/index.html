<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="panelTitle"></title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    font-family: system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', sans-serif;
    color: #202124;
    font-size: 13px;
    line-height: 1.4;
  }
  .header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid #eee;
  }
  .header img { width: 22px; height: 22px; border-radius: 5px; }
  .title { margin: 0; font-size: 15px; font-weight: 600; flex: 1; white-space: nowrap; }
  .title { display: flex; align-items: center; }
  /* 見出しの「スライド」「ドキュメント」のバッジ(スライドは薄いイエロー、ドキュメントは薄いブルー) */
  .title .modeName {
    margin-left: 8px; padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px; font-weight: 600; line-height: 16px;
  }
  body[data-kind='slides'] .modeName { background: #fef7e0; color: #8a6100; border: 1px solid #f9e3a7; }
  body[data-kind='docs'] .modeName { background: #e8f0fe; color: #1967d2; border: 1px solid #c6dafc; }
  .body { padding: 4px 16px 16px; }

  .notice {
    margin: 12px 0 4px; padding: 10px 12px;
    border-radius: 8px; background: #fef7e0; color: #5f4b00;
    font-size: 12px;
  }
  .notice[hidden] { display: none; }

  .toggleRow {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0;
    font-size: 14px; font-weight: 500;
  }
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: #bdc1c6; border-radius: 22px;
    transition: 0.15s; cursor: pointer;
  }
  .slider::before {
    content: ''; position: absolute;
    width: 18px; height: 18px; left: 2px; top: 2px;
    background: #fff; border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    transition: 0.15s;
  }
  input:checked + .slider { background: #1a73e8; }
  input:checked + .slider::before { transform: translateX(18px); }

  .sectionLabel {
    margin: 14px 0 8px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    color: #5f6368;
  }
  .grid {
    display: grid;
    grid-template-columns: 64px 1fr;
    column-gap: 8px; row-gap: 10px;
    align-items: center;
  }
  .grid > label { font-size: 12px; color: #3c4043; }
  .grid > label.top { align-self: start; padding-top: 8px; }
  select {
    width: 100%; height: 32px;
    padding: 0 6px;
    border: 1px solid #dadce0; border-radius: 6px;
    background: #fff; color: #202124;
    font-size: 12px;
  }
  .segGroup { display: flex; gap: 6px; }
  .segBtn {
    flex: 1; height: 32px;
    border: 1px solid #dadce0; border-radius: 6px;
    background: #fff; color: #3c4043;
    font-size: 12px; cursor: pointer;
  }
  .segBtn:hover:not(.active) { background: #f1f3f4; }
  .segBtn.active { background: #1a73e8; border-color: #1a73e8; color: #fff; font-weight: 500; }
  .sizeHint { min-height: 14px; margin-top: 4px; font-size: 11px; color: #5f6368; }
  input[type='color'] {
    width: 44px; height: 30px; padding: 2px;
    border: 1px solid #dadce0; border-radius: 6px;
    background: #fff; cursor: pointer;
  }

  .btnRow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button.primary {
    height: 36px;
    border: none; border-radius: 8px;
    background: #1a73e8; color: #fff;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
  }
  button.primary:hover { background: #1765cc; }
  button:disabled { opacity: 0.5; cursor: default; }
  .checkRow {
    display: flex; align-items: center; gap: 6px;
    margin-top: 10px;
    font-size: 12px; color: #3c4043;
    cursor: pointer;
  }
  .checkRow input { margin: 0; accent-color: #1a73e8; }
  button.secondary {
    height: 34px;
    border: 1px solid #dadce0; border-radius: 8px;
    background: #fff; color: #c5221f;
    font-size: 12px;
    cursor: pointer;
  }
  button.secondary:hover { background: #fce8e6; border-color: #f5c6c2; }
  #deleteSection[hidden] { display: none; }

  .confirmBox {
    margin-top: 10px; padding: 10px 12px;
    border: 1px solid #dadce0; border-radius: 8px; background: #f8f9fa;
    font-size: 12px;
  }
  .confirmBox[hidden] { display: none; }
  .confirmBox p { margin: 0 0 10px; white-space: pre-line; }
  .confirmBox .btnRow button { height: 32px; font-size: 12px; }
  button.plain {
    border: 1px solid #dadce0; border-radius: 8px;
    background: #fff; color: #3c4043; cursor: pointer;
  }

  #writeStatus { min-height: 16px; margin-top: 10px; font-size: 12px; color: #5f6368; white-space: pre-line; }
  #writeStatus.error { color: #c5221f; }
  #writeStatus.success { color: #188038; }

  /* 画面の種類(body の data-kind: slides / docs)で、スライド用・ドキュメント用の部分を出し分ける */
  body:not([data-kind='slides']) .slidesOnly { display: none !important; }
  body:not([data-kind='docs']) .docsOnly { display: none !important; }
  .choices { display: grid; gap: 4px; }
  .choice {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px;
    border: 1px solid #dadce0; border-radius: 6px;
    font-size: 12px; cursor: pointer;
  }
  .choice input { margin: 0; accent-color: #1a73e8; }
  .choice:has(input:checked) { border-color: #1a73e8; background: #e8f0fe; }
  .segBtn:disabled { opacity: 0.45; cursor: default; background: #f1f3f4; }
  .segBtn.active:disabled { background: #8ab4f8; border-color: #8ab4f8; }
  select:disabled, input[type='color']:disabled { opacity: 0.45; cursor: default; }
  .fieldHint { margin-top: 4px; font-size: 11px; color: #5f6368; }
  .fieldHint[hidden] { display: none; }
  button.secondary.wide { width: 100%; }

  .footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid #eee; }
  .footer a { font-size: 12px; color: #1a73e8; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body data-kind="slides">
  <div class="header">
    <img src="/icons/icon48.png" alt="" />
    <h1 class="title"><span data-i18n="panelTitle"></span><span class="modeName" id="modeName"></span></h1>
  </div>
  <div class="body">
    <div class="notice" id="notSupportedNotice" data-i18n="sidePanelNotSupported" hidden></div>

    <div class="toggleRow slidesOnly">
      <label for="enabled" data-i18n="toggleShowRuby"></label>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="sectionLabel" data-i18n="sectionAppearance"></div>
    <div class="grid">
      <label class="top docsOnly" data-i18n="labelDocsStyle"></label>
      <div class="choices docsOnly" id="docsStyleGroup" role="radiogroup" data-i18n-aria-label="docsStyleGroupAriaLabel">
        <label class="choice"><input type="radio" name="docsStyle" value="table" /><span data-i18n="docsStyleTable"></span></label>
        <label class="choice"><input type="radio" name="docsStyle" value="table-compact" /><span data-i18n="docsStyleTableCompact"></span></label>
        <label class="choice"><input type="radio" name="docsStyle" value="paren" /><span data-i18n="docsStyleParen"></span></label>
        <label class="choice"><input type="radio" name="docsStyle" value="paren-small" /><span data-i18n="docsStyleParenSmall"></span></label>
        <label class="choice"><input type="radio" name="docsStyle" value="superscript" /><span data-i18n="docsStyleSuperscript"></span></label>
      </div>
      <label class="slidesOnly" for="rubyLanguage" data-i18n="labelRubyLanguage"></label>
      <select id="rubyLanguage" class="slidesOnly">
        <option value="ja" data-i18n="rubyLanguageJa"></option>
        <option value="zh" data-i18n="rubyLanguageZh"></option>
      </select>
      <label data-i18n="labelRubyMode"></label>
      <div class="segGroup" id="rubyModeGroup" role="group" data-i18n-aria-label="rubyModeGroupAriaLabel">
        <button type="button" class="segBtn" data-mode="per-kanji" data-i18n="rubyModePerKanji"></button>
        <button type="button" class="segBtn" data-mode="per-word" data-i18n="rubyModePerWord"></button>
      </div>
      <label class="top" data-i18n="labelSize"></label>
      <div>
        <div class="segGroup" id="sizeGroup" role="group" data-i18n-aria-label="sizeGroupAriaLabel">
          <button type="button" class="segBtn" data-size="small" data-i18n="sizeSmall"></button>
          <button type="button" class="segBtn" data-size="medium" data-i18n="sizeMedium"></button>
          <button type="button" class="segBtn" data-size="large" data-i18n="sizeLarge"></button>
        </div>
        <div class="sizeHint slidesOnly" id="sizeHint" role="status"></div>
        <div class="fieldHint docsOnly" id="docsSizeHint" data-i18n="hintDocsSizeUnused" hidden></div>
      </div>
      <label class="top" for="fontFamily" data-i18n="labelFont"></label>
      <div>
        <select id="fontFamily"></select>
        <div class="fieldHint docsOnly" id="docsFontHint" data-i18n="hintDocsFontUnused" hidden></div>
      </div>
      <label class="top" for="color" data-i18n="labelColor"></label>
      <div>
        <input type="color" id="color" />
        <div class="fieldHint docsOnly" id="docsColorHint" data-i18n="hintDocsColorUnused" hidden></div>
      </div>
      <label for="skipKanji" data-i18n="labelGradeFilter"></label>
      <select id="skipKanji">
        <option value="none" data-i18n="gradeFilterNone"></option>
        <optgroup data-i18n-group="skipKanjiGroupGrade">
          <option value="grade-1" data-i18n-grade="1"></option>
          <option value="grade-2" data-i18n-grade="2"></option>
          <option value="grade-3" data-i18n-grade="3"></option>
          <option value="grade-4" data-i18n-grade="4"></option>
          <option value="grade-5" data-i18n-grade="5"></option>
          <option value="grade-6" data-i18n-grade="6"></option>
        </optgroup>
        <optgroup data-i18n-group="skipKanjiGroupJlpt">
          <option value="jlpt-n5" data-i18n-jlpt="5"></option>
          <option value="jlpt-n4" data-i18n-jlpt="4"></option>
          <option value="jlpt-n3" data-i18n-jlpt="3"></option>
          <option value="jlpt-n2" data-i18n-jlpt="2"></option>
          <option value="jlpt-n1" data-i18n-jlpt="1"></option>
        </optgroup>
      </select>
    </div>

    <div class="sectionLabel slidesOnly" data-i18n="sectionWrite"></div>
    <div class="btnRow slidesOnly">
      <button type="button" class="primary" id="writeCurrentSlide" data-i18n="btnCurrentSlide"></button>
      <button type="button" class="primary" id="writeAllSlides" data-i18n="btnAllSlides"></button>
    </div>
    <label class="checkRow slidesOnly">
      <input type="checkbox" id="groupWithOriginal" />
      <span data-i18n="labelGroupWithOriginal"></span>
    </label>

    <div id="deleteSection" class="slidesOnly" hidden>
      <div class="sectionLabel" data-i18n="sectionDelete"></div>
      <div class="btnRow">
        <button type="button" class="secondary" id="deleteCurrentSlide" data-i18n="btnCurrentSlide"></button>
        <button type="button" class="secondary" id="deleteAllSlides" data-i18n="btnAllSlides"></button>
      </div>
    </div>

    <div class="sectionLabel docsOnly" data-i18n="sectionWriteDocs"></div>
    <div class="btnRow docsOnly">
      <button type="button" class="primary" id="docsWrite" data-i18n="btnDocsWrite"></button>
      <button type="button" class="secondary" id="docsDelete" data-i18n="btnDocsDelete"></button>
    </div>

    <div class="confirmBox" id="confirmBox" role="alertdialog" hidden>
      <p id="confirmText"></p>
      <div class="btnRow">
        <button type="button" class="plain" id="confirmCancel" data-i18n="btnCancelConfirm"></button>
        <button type="button" class="primary" id="confirmOk" data-i18n="btnConfirmRun"></button>
      </div>
    </div>

    <div id="writeStatus" role="status"></div>

    <div class="footer">
      <a href="#" id="openOptions" data-i18n="linkEditUserDict"></a>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
