<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ルビふり 詳細設定</title>
    <style>
      body {
        max-width: 680px;
        margin: 0 auto;
        padding: 24px 20px 60px;
        font-family: system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', sans-serif;
        color: #202124;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 14px;
        margin: 28px 0 10px;
        color: #3c4043;
      }
      p.lead {
        font-size: 12px;
        color: #5f6368;
        margin: 0 0 20px;
      }
      .hint {
        font-size: 11px;
        color: #5f6368;
        margin-top: 4px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #e0e0e0;
        vertical-align: top;
      }
      th {
        color: #5f6368;
        font-weight: 600;
        font-size: 11px;
      }
      td.actions {
        white-space: nowrap;
        text-align: right;
      }
      td.actions button {
        width: auto;
        display: inline-block;
        margin: 0 0 0 6px;
        padding: 4px 10px;
      }
      #emptyRow td {
        color: #5f6368;
        text-align: center;
        padding: 16px 8px;
      }
      form {
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 14px 16px;
        margin-top: 10px;
      }
      .field {
        margin-bottom: 12px;
      }
      .field label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
      }
      .field input[type='text'],
      .field select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        font-size: 13px;
      }
      .field-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .field-row input[type='checkbox'] {
        flex: none;
      }
      .field-row label.checkbox-label {
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      .style-sub {
        margin-left: 22px;
        margin-top: 6px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .style-sub[hidden] {
        display: none;
      }
      input[type='color'] {
        width: 40px;
        height: 26px;
        padding: 0;
        border: 1px solid #dadce0;
        border-radius: 4px;
        cursor: pointer;
      }
      input[type='range'] {
        width: 100%;
      }
      .sizeGroup {
        display: flex;
        gap: 6px;
      }
      .sizeBtn {
        flex: 1;
        height: 30px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        background: white;
        color: #3c4043;
        font-size: 12px;
        cursor: pointer;
      }
      .sizeBtn:hover:not(:disabled) {
        background: #f1f3f4;
      }
      .sizeBtn.active {
        background: #1a73e8;
        border-color: #1a73e8;
        color: white;
        font-weight: 500;
      }
      .sizeBtn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button {
        padding: 7px 14px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        background: white;
        font-size: 12px;
        cursor: pointer;
        color: #202124;
      }
      button:hover {
        background: #f1f3f4;
      }
      button.primary {
        background: #1a73e8;
        border-color: #1a73e8;
        color: white;
      }
      button.primary:hover {
        background: #1765cc;
      }
      button.danger {
        color: #c5221f;
      }
      .form-actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      #formStatus {
        font-size: 12px;
        min-height: 16px;
        margin-top: 8px;
      }
      #formStatus.error {
        color: #c5221f;
      }
      #formStatus.success {
        color: #188038;
      }
      .import-export {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #importExportStatus {
        font-size: 12px;
        min-height: 16px;
        margin-top: 8px;
      }
      #importExportStatus.error {
        color: #c5221f;
      }
      #importExportStatus.success {
        color: #188038;
      }
      code {
        background: #f1f3f4;
        padding: 1px 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h1>ルビふり 詳細設定</h1>
    <p class="lead">
      特定の単語だけ読みを直したい、見た目(フォント・色・サイズ)を変えたい場合はここでユーザー辞書に登録してください。ユーザー辞書は学年フィルタより優先され、モード A(画面表示)・モード
      B(スライドへの書き込み)の両方に反映されます。
    </p>

    <h2>登録済みの単語</h2>
    <table>
      <thead>
        <tr>
          <th>表層形</th>
          <th>読み</th>
          <th>見た目</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="entryList">
        <tr id="emptyRow">
          <td colspan="4">まだ登録された単語はありません</td>
        </tr>
      </tbody>
    </table>

    <h2 id="formTitle">単語を追加</h2>
    <form id="entryForm">
      <div class="field">
        <label for="surface">表層形(スライド上の表記。漢字を1文字以上含める)</label>
        <input type="text" id="surface" placeholder="例: 麻雀" />
      </div>

      <div class="field-row" style="margin-bottom: 12px">
        <input type="checkbox" id="readingEnabled" />
        <label for="readingEnabled" class="checkbox-label" style="margin-bottom: 0">読みを上書きする</label>
      </div>
      <div class="field" id="readingField" hidden>
        <label for="reading">読み(ひらがな)</label>
        <input type="text" id="reading" placeholder="例: まーじゃん" />
      </div>

      <div class="field-row" style="margin-bottom: 4px">
        <input type="checkbox" id="styleEnabled" />
        <label for="styleEnabled" class="checkbox-label" style="margin-bottom: 0">見た目を個別設定する</label>
      </div>
      <div class="style-sub" id="styleFields" hidden>
        <div class="field-row">
          <input type="checkbox" id="fontFamilyEnabled" />
          <label for="fontFamilyEnabled" class="checkbox-label" style="margin-bottom: 0">フォント</label>
          <select id="fontFamily" disabled></select>
        </div>
        <div class="field-row">
          <input type="checkbox" id="colorEnabled" />
          <label for="colorEnabled" class="checkbox-label" style="margin-bottom: 0">色</label>
          <input type="color" id="color" disabled />
        </div>
        <div class="field-row">
          <input type="checkbox" id="sizeRatioEnabled" />
          <label for="sizeRatioEnabled" class="checkbox-label" style="margin-bottom: 0">サイズ</label>
        </div>
        <div class="sizeGroup" id="sizeGroup">
          <button type="button" class="sizeBtn" data-size="small" disabled>小</button>
          <button type="button" class="sizeBtn" data-size="medium" disabled>中</button>
          <button type="button" class="sizeBtn" data-size="large" disabled>大</button>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="primary" id="saveBtn">追加する</button>
        <button type="button" id="cancelEditBtn" hidden>編集をキャンセル</button>
      </div>
      <div id="formStatus"></div>
    </form>

    <h2>バックアップ</h2>
    <div class="import-export">
      <button id="exportBtn">エクスポート(JSONファイルを保存)</button>
      <button id="importBtn">インポート(JSONファイルを読み込み)</button>
      <input type="file" id="importFile" accept="application/json" hidden />
    </div>
    <div id="importExportStatus"></div>
    <p class="hint">インポートすると現在のユーザー辞書は<strong>丸ごと置き換わります</strong>(マージではありません)。</p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
